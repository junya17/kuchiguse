<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>口ぐせ — 自分の言葉で覚える英語</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light only;
    --sumi:#16181C;
    --washi:#EDEEEA;
    --washi-2:#E3E5DF;
    --gunjo:#24418C;
    --shu:#B4402F;
    --kigara:#8C8878;
    --line:rgba(22,24,28,.14);
    --serif:'Newsreader',Georgia,serif;
    --jp:'Zen Kaku Gothic New',system-ui,sans-serif;
    --mincho:'Zen Old Mincho',serif;
    --mono:'Roboto Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--washi);color:var(--sumi)}
  body{font-family:var(--jp);line-height:1.7;-webkit-font-smoothing:antialiased;padding:0 0 6rem}
  .wrap{max-width:640px;margin:0 auto;padding:0 1.25rem}

  /* ---- header ---- */
  header{padding:2.25rem 0 1.25rem}
  .mark{font-family:var(--mincho);font-size:2.1rem;letter-spacing:.14em;line-height:1}
  .mark span{color:var(--gunjo)}
  .tag{font-family:var(--mono);font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;color:var(--kigara);margin-top:.6rem}
  #voice{margin-top:.7rem;font-family:var(--mono);font-size:.68rem;color:var(--kigara);background:none;border:1px solid var(--line);border-radius:2px;padding:.25rem .4rem;max-width:100%}

  /* signature: the snapped ink line */
  .snap{height:1px;background:var(--gunjo);transform-origin:left center;transform:scaleX(0);opacity:.55}
  .snap.on{animation:snap .5s cubic-bezier(.16,1,.3,1) forwards}
  @keyframes snap{0%{transform:scaleX(0)}70%{transform:scaleX(1.0);opacity:.9}
    78%{transform:scaleX(1) translateY(-1px)}86%{transform:scaleX(1) translateY(1px)}100%{transform:scaleX(1) translateY(0);opacity:.55}}
  .rule{height:1px;background:var(--line);margin:2rem 0 1.25rem;position:relative}
  .rule::before{content:"";position:absolute;left:0;top:-3px;width:1px;height:7px;background:var(--gunjo)}
  .rule-label{font-family:var(--mono);font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;color:var(--kigara);margin:-.6rem 0 1rem;padding-left:.9rem}

  /* ---- input ---- */
  .times{display:flex;gap:.5rem;margin-bottom:.75rem}
  .times button{flex:1;font-family:var(--jp);font-size:.85rem;padding:.55rem 0;background:none;border:1px solid var(--line);border-radius:2px;color:var(--kigara);cursor:pointer;transition:.18s}
  .times button[aria-pressed="true"]{border-color:var(--gunjo);color:var(--gunjo);background:rgba(36,65,140,.05)}
  textarea{width:100%;min-height:5.5rem;resize:vertical;font-family:var(--jp);font-size:1rem;line-height:1.6;padding:.85rem;background:#fff;border:1px solid var(--line);border-radius:2px;color:var(--sumi)}
  textarea:focus,.times button:focus-visible,button:focus-visible{outline:2px solid var(--gunjo);outline-offset:2px}
  textarea::placeholder{color:#B5B2A6}
  .go{margin-top:.75rem;width:100%;padding:.85rem;background:var(--sumi);color:var(--washi);border:0;border-radius:2px;font-family:var(--jp);font-size:.95rem;letter-spacing:.06em;cursor:pointer;transition:.18s}
  .go:hover{background:var(--gunjo)}
  .go:disabled{background:var(--kigara);cursor:default}

  /* ---- card ---- */
  .card{background:#fff;border:1px solid var(--line);border-radius:2px;padding:1.15rem 1.1rem;margin-top:1.1rem}
  .seed{font-family:var(--mono);font-size:.66rem;letter-spacing:.16em;color:var(--kigara);text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
  .lv{padding:.9rem 0;border-top:1px solid var(--line);margin-top:.85rem}
  .lv:first-of-type{border-top:0;margin-top:.5rem;padding-top:.35rem}
  .lv-label{font-family:var(--mono);font-size:.62rem;letter-spacing:.18em;color:var(--gunjo);text-transform:uppercase}
  .en{font-family:var(--serif);font-size:1.32rem;line-height:1.45;margin:.3rem 0 .25rem;cursor:pointer}
  .en:hover{color:var(--gunjo)}
  .ja{font-size:.83rem;color:var(--kigara)}
  .chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.45rem}
  .chip{font-family:var(--serif);font-size:.92rem;padding:.32rem .6rem;background:var(--washi-2);border:0;border-radius:2px;color:var(--sumi);cursor:pointer;transition:.15s}
  .chip:hover{background:var(--gunjo);color:#fff}
  .chip i{font-family:var(--jp);font-style:normal;font-size:.7rem;color:var(--kigara);margin-left:.35rem}
  .chip:hover i{color:rgba(255,255,255,.7)}
  .zoom{display:flex;gap:.55rem;align-items:baseline;padding:.5rem 0}
  .zoom em{font-family:var(--mono);font-style:normal;font-size:.6rem;letter-spacing:.14em;color:var(--kigara);white-space:nowrap;padding-top:.3rem}
  .zoom p{font-family:var(--serif);font-size:1rem}
  .zoom p small{display:block;font-family:var(--jp);font-size:.76rem;color:var(--kigara)}
  .save{margin-top:.9rem;width:100%;padding:.6rem;background:none;border:1px solid var(--gunjo);color:var(--gunjo);border-radius:2px;font-family:var(--jp);font-size:.85rem;cursor:pointer}
  .save:hover{background:var(--gunjo);color:#fff}

  /* ---- saved list ---- */
  .day{margin-bottom:1.4rem}
  .day h3{font-family:var(--mincho);font-size:1rem;letter-spacing:.1em;font-weight:600;margin-bottom:.5rem}
  .item{padding:.7rem 0;border-top:1px solid var(--line);display:flex;gap:.7rem;align-items:flex-start}
  .item p{flex:1;font-family:var(--serif);font-size:1.05rem;line-height:1.4;cursor:pointer}
  .item p small{display:block;font-family:var(--jp);font-size:.74rem;color:var(--kigara);margin-top:.1rem}
  .del{background:none;border:0;color:#C9C6BA;font-size:1rem;cursor:pointer;padding:0 .2rem;line-height:1}
  .del:hover{color:var(--shu)}
  .empty{font-size:.85rem;color:var(--kigara)}
  .yg{margin-left:.6rem;font-family:var(--mono);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;background:none;border:1px solid var(--line);border-radius:2px;color:var(--gunjo);padding:.15rem .4rem;cursor:pointer;transition:.15s;white-space:nowrap}
  .yg:hover{background:var(--gunjo);color:#fff;border-color:var(--gunjo)}
  .item .yg{margin-left:0;align-self:center}
  .err{font-size:.85rem;color:var(--shu);margin-top:.8rem}
  .loading{font-family:var(--mono);font-size:.68rem;letter-spacing:.2em;color:var(--gunjo);text-transform:uppercase;margin-top:1rem}
  @media (prefers-reduced-motion:reduce){.snap.on{animation:none;transform:scaleX(1)}*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark">口<span>ぐせ</span></div>
    <div class="tag">the english you actually say</div>
    <select id="voice" aria-label="読み上げ音声"></select>
  </header>
  <div class="snap on" id="snap0"></div>

  <section style="padding-top:1.4rem">
    <div class="times" id="times">
      <button data-t="朝" aria-pressed="true">朝</button>
      <button data-t="昼" aria-pressed="false">昼</button>
      <button data-t="夜" aria-pressed="false">夜</button>
    </div>
    <textarea id="seed" placeholder="今やったこと・言ったことを日本語で。&#10;例）湯を沸かしてる間に洗濯物を干した"></textarea>
    <button class="go" id="go">英語にして展開する</button>
    <div id="status"></div>
    <div id="out"></div>
  </section>

  <div class="rule"></div>
  <div class="rule-label">音読リスト</div>
  <section id="saved"></section>
</div>

<script>
/* ---------- storage (localStorage) ---------- */
const KEY='kuchiguse:cards';
let cards=[];
function load(){
  try{cards=JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){cards=[];}
}
function persist(){
  try{localStorage.setItem(KEY,JSON.stringify(cards));}catch(e){}
}

/* ---------- state ---------- */
let timeTag='朝';
const $=s=>document.querySelector(s);
$('#times').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  timeTag=b.dataset.t;
  [...$('#times').children].forEach(x=>x.setAttribute('aria-pressed',x===b));
});

/* ---------- youglish ---------- */
const SKIP=/^(i|you|we|he|she|it|they|the|a|an|my|your|his|her|their|our|there|this|that)$/i;
function ygPhrase(s){
  let w=String(s).replace(/[.,!?;:"'’]/g,'').split(/\s+/).filter(Boolean);
  while(w.length>4&&SKIP.test(w[0]))w.shift();
  return w.slice(0,4).join(' ');
}
function yg(s){
  const q=encodeURIComponent(ygPhrase(s)).replace(/%20/g,'+');
  window.open('https://youglish.com/pronounce/'+q+'/english','_blank','noopener');
}

/* ---------- speech ---------- */
let voices=[],chosen=null;
const GOOD=/siri|premium|enhanced|natural|neural|samantha|ava|zoe|allison|nicky|google us|google uk/i;
function loadVoices(){
  voices=speechSynthesis.getVoices().filter(v=>/^en(-|_|$)/i.test(v.lang));
  voices.sort((a,b)=>(GOOD.test(b.name)?1:0)-(GOOD.test(a.name)?1:0));
  chosen=voices[0]||null;
  const sel=$('#voice');
  sel.innerHTML=voices.map((v,i)=>`<option value="${i}">${v.name}</option>`).join('');
  sel.style.display=voices.length?'block':'none';
}
if('speechSynthesis' in window){
  loadVoices();
  speechSynthesis.onvoiceschanged=loadVoices;
}
document.addEventListener('change',e=>{
  if(e.target.id==='voice'){chosen=voices[e.target.value];say('This is how it sounds.');}
});
function say(text){
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US'; u.rate=.88; u.pitch=1.0;
  if(chosen)u.voice=chosen;
  speechSynthesis.speak(u);
}

/* ---------- generation ---------- */
const SYS=`入力された日本語の一文を、その人が実際に口に出せる英語に変換し、関連語へ展開してください。
出力はJSONのみ。前置き・コードフェンス・説明を一切書かないこと。

{
 "levels":[
   {"label":"ひとこと","en":"独り言や短いやりとりで出る、いちばん短い言い方","ja":"日本語訳"},
   {"label":"自然","en":"ネイティブが日常会話でそのまま使う自然な言い方","ja":"日本語訳"},
   {"label":"くわしく","en":"相手に状況を伝える、もう少し情報の多い言い方","ja":"日本語訳"}
 ],
 "collocations":[{"en":"語やコロケーション","ja":"訳"} ×5],
 "zoom_in":{"en":"一段具体的な文（何を・どうやって・どこで）","ja":"訳"},
 "zoom_out":{"en":"一段抽象的な文（それは何のためか・どういう習慣か）","ja":"訳"}
}

規則:
- 英文は必ず主語から始まる完全な文。教科書的な直訳ではなく、実際にその場面で口から出る言い方を優先する。
- 入力の話題が何であれ（家事・食事・支度・移動・趣味・仕事・体調・天気など）その分野で実際に使われる語を選ぶ。日本語独特の概念は無理に一語対応させず、英語話者が同じ場面で言う表現に置き換える。
- collocationsは、その動作や物に必ず付いてくる名詞・動詞を選ぶ。`;

async function generate(text){
  const res=await fetch("/api/gen",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({system:SYS,time:timeTag,text})
  });
  if(!res.ok)throw new Error("api "+res.status);
  const data=await res.json();
  const raw=data.content.filter(b=>b.type==="text").map(b=>b.text).join("");
  return JSON.parse(raw.replace(/```json|```/g,'').trim());
}

$('#go').addEventListener('click',()=>run($('#seed').value.trim()));
$('#seed').addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter')run($('#seed').value.trim());});

async function run(text){
  if(!text)return;
  const go=$('#go'); go.disabled=true;
  $('#status').innerHTML='<div class="loading">generating…</div>';
  $('#out').innerHTML='';
  try{
    const d=await generate(text);
    $('#status').innerHTML='';
    renderCard(text,d);
  }catch(err){
    $('#status').innerHTML='<div class="err">生成できませんでした。文を短くするか、もう一度試してください。</div>';
  }
  go.disabled=false;
}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function renderCard(seed,d){
  const el=document.createElement('div');
  el.innerHTML=`<div class="snap"></div><div class="card">
    <div class="seed"><span>${esc(timeTag)} — ${esc(seed).slice(0,40)}</span></div>
    ${d.levels.map(l=>`<div class="lv">
        <div class="lv-label">${esc(l.label)}</div>
        <div class="en" data-say="${esc(l.en)}">${esc(l.en)}</div>
        <div class="ja">${esc(l.ja)}<button class="yg" data-yg="${esc(l.en)}">YouGlish</button></div>
      </div>`).join('')}
    <div class="lv">
      <div class="lv-label">関連語 — タップで枝を伸ばす</div>
      <div class="chips">${d.collocations.map(c=>`<button class="chip" data-seed="${esc(c.ja)}">${esc(c.en)}<i>${esc(c.ja)}</i></button>`).join('')}</div>
    </div>
    <div class="lv">
      <div class="zoom"><em>具体 ↓</em><p class="en" data-say="${esc(d.zoom_in.en)}">${esc(d.zoom_in.en)}<small>${esc(d.zoom_in.ja)}</small></p></div>
      <div class="zoom"><em>抽象 ↑</em><p class="en" data-say="${esc(d.zoom_out.en)}">${esc(d.zoom_out.en)}<small>${esc(d.zoom_out.ja)}</small></p></div>
    </div>
    <button class="save">音読リストに入れる</button>
  </div>`;
  $('#out').appendChild(el);
  requestAnimationFrame(()=>el.querySelector('.snap').classList.add('on'));

  el.addEventListener('click',async e=>{
    const g=e.target.closest('[data-yg]'); if(g){yg(g.dataset.yg);return;}
    const s=e.target.closest('[data-say]'); if(s){say(s.dataset.say);return;}
    const chip=e.target.closest('.chip');
    if(chip){const s2=chip.dataset.seed+'を使う場面'; $('#seed').value=s2; run(s2); return;}
    if(e.target.closest('.save')){
      d.levels.forEach(l=>cards.push({id:Date.now()+Math.random(),t:timeTag,en:l.en,ja:l.ja}));
      persist(); renderSaved();
      e.target.closest('.save').textContent='入れました';
    }
  });
}

/* ---------- saved list ---------- */
function renderSaved(){
  const box=$('#saved');
  if(!cards.length){box.innerHTML='<p class="empty">まだ空です。今日やったことを一行入れてみてください。</p>';return;}
  box.innerHTML=['朝','昼','夜'].map(t=>{
    const list=cards.filter(c=>c.t===t); if(!list.length)return'';
    return `<div class="day"><h3>${t}</h3>${list.map(c=>`<div class="item">
      <p data-say="${esc(c.en)}">${esc(c.en)}<small>${esc(c.ja)}</small></p>
      <button class="yg" data-yg="${esc(c.en)}">YG</button>
      <button class="del" data-id="${c.id}" aria-label="削除">×</button></div>`).join('')}</div>`;
  }).join('');
}
$('#saved').addEventListener('click',async e=>{
  const g=e.target.closest('[data-yg]'); if(g){yg(g.dataset.yg);return;}
  const s=e.target.closest('[data-say]'); if(s){say(s.dataset.say);return;}
  const d=e.target.closest('.del');
  if(d){cards=cards.filter(c=>String(c.id)!==d.dataset.id); persist(); renderSaved();}
});

load();renderSaved();
</script>
</body>
</html>
